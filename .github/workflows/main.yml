name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  tests:
    name: Tests
    uses: rnro/github-workflows/.github/workflows/package_test.yml@unification
    with:
      # A fork's default branch does not carry the change, so the ref is named.
      # A released version needs neither input.
      workflows_repository: rnro/github-workflows
      workflows_ref: unification
      # Named because a concurrency group is keyed on it, and this workflow calls
      # the reusable workflows more than once.
      name: tests

      # Per-version arguments are one object rather than an input per version; a
      # plain string is the argument list.
      linux_version_overrides: |
        6.1: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
        6.2: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
        6.3: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
        nightly-release: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error

      # macOS. The two version lists combine, so the Xcode beta runs alongside the
      # release toolchains. Unlike the pull-request workflow this also runs the
      # simulator tests; the macOS target is build-only pending an outstanding
      # issue with running its tests.
      enable_macos: true
      macos_repository_owner: apple
      macos_runner_pool: nightly
      xcode_scheme: swift-nio-Package
      macos_swift_versions: '["6.1", "6.2", "6.3"]'
      macos_xcode_versions: '["latest-beta"]'
      xcode_debug_output: true
      enable_macos_xcode_build: true
      enable_ios_xcode_build: true
      enable_ios_xcode_test: true
      enable_watchos_xcode_build: true
      enable_watchos_xcode_test: true
      enable_tvos_xcode_build: true
      enable_tvos_xcode_test: true
      enable_visionos_xcode_build: true
      enable_visionos_xcode_test: true

      # Job kinds that were a workflow each.
      enable_cxx_interop: true
      enable_linux_static_sdk_build: true
      enable_wasm_sdk_build: true
      wasm_sdk_build_command: "swift build --target NIOCore"
      enable_android_sdk_build: true

  benchmarks:
    name: Benchmarks
    uses: rnro/github-workflows/.github/workflows/benchmarks.yml@unification
    with:
      # A fork's default branch does not carry the change, so the ref is named.
      # A released version needs neither input.
      workflows_repository: rnro/github-workflows
      workflows_ref: unification
      benchmark_package_path: "Benchmarks"

  release-builds:
    name: Release builds
    uses: rnro/github-workflows/.github/workflows/release_build.yml@unification
    with:
      # A fork's default branch does not carry the change, so the ref is named.
      # A released version needs neither input.
      workflows_repository: rnro/github-workflows
      workflows_ref: unification
      name: release-builds
      enable_windows: true

  # Integration tests are not a job kind package_test.yml covers, so they pair the
  # blessed toolchain axis with their own command rather than restating the
  # platforms, runners and images.
  integration-test-toolchains:
    name: Integration test toolchains
    uses: rnro/github-workflows/.github/workflows/toolchain_matrix.yml@unification
    with:
      # A fork's default branch does not carry the change, so the ref is named.
      # A released version needs neither input.
      workflows_repository: rnro/github-workflows
      workflows_ref: unification
      enable_windows: false
      linux_env_vars: '{"NIO_ALLOC_COUNTER_TESTS_PARALLEL": "true"}'

  integration-tests:
    name: Integration tests
    needs: integration-test-toolchains
    uses: rnro/github-workflows/.github/workflows/execute_matrix.yml@unification
    with:
      # A fork's default branch does not carry the change, so the ref is named.
      # A released version needs neither input.
      workflows_repository: rnro/github-workflows
      workflows_ref: unification
      name: integration-tests
      matrix_yaml_string: ${{ needs.integration-test-toolchains.outputs.matrix_yaml }}
      # The job runs unprivileged on the runner but as root in a container,
      # where sudo is not installed. nightly-release is always containerised,
      # because swiftly cannot install it, so both cases are reached.
      setup_command: |
        if command -v sudo >/dev/null 2>&1; then
          sudo apt-get update -y -q && sudo apt-get install -y -q lsof dnsutils netcat-openbsd net-tools curl jq
        else
          apt-get update -y -q && apt-get install -y -q lsof dnsutils netcat-openbsd net-tools curl jq
        fi
      command: "./scripts/integration_tests.sh"
