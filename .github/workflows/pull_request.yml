name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.10
    with:
      license_header_check_project_name: "SwiftNIO"
      # Workaround https://github.com/swiftlang/swift-docc/issues/1280
      docs_check_container_image: "swift:6.1-noble"

  tests:
    name: Tests
    uses: rnro/github-workflows/.github/workflows/package_test.yml@self-repo-reference
    with:
      # Named because a concurrency group is keyed on it, and this workflow calls
      # the reusable workflows more than once.
      name: tests
      # Not run by this package.
      enable_macos_swiftly: false
      enable_embedded_wasm_sdk_build: false
      enable_android_emulator_tests: false

      # Four releases are supported, one more than the default window, and the
      # performance thresholds are files named for versions, so the lists name
      # versions.
      linux_swift_versions: &linux_swift_versions '["6.1", "6.2", "6.3", "6.4", "nightly-release", "nightly-main"]'
      windows_swift_versions: '["6.3", "6.4", "nightly-release", "nightly-main"]'

      linux_env_vars: '{"SWIFTNIO_CI": "1"}'
      # Arguments written alone apply to every version. A `default` key does the
      # same, and a version's own key replaces it for that version.
      linux_version_overrides: |
        default: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error

      # The two version lists combine, so the Xcode beta runs alongside the release
      # toolchains. Builds only; main.yml runs the simulator tests.
      macos_env_vars: '{"SWIFTNIO_CI": "1"}'
      macos_swift_versions: '["6.1", "6.2", "6.3", "6.4"]'
      macos_xcode_versions: '["latest-beta"]'
      xcode_scheme: swift-nio-Package
      # A bare list takes every target's defaults: build, and do not test.
      xcode_targets: '[macOS, iOS, watchOS, tvOS, visionOS]'

      linux_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      windows_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      wasm_sdk_command: "swift build --target NIOCore"

  benchmarks:
    name: Benchmarks
    uses: rnro/github-workflows/.github/workflows/benchmarks.yml@self-repo-reference
    with:
      benchmark_package_paths: '["Benchmarks"]'
      linux_swift_versions: *linux_swift_versions

  # Integration tests are not a job kind package_test.yml covers, so they pair the
  # blessed toolchain axis with their own command rather than restating the
  # platforms, runners and images.
  integration-test-toolchains:
    name: Integration test toolchains
    uses: rnro/github-workflows/.github/workflows/toolchain_matrix.yml@self-repo-reference
    with:
      enable_windows: false
      linux_swift_versions: *linux_swift_versions
      linux_env_vars: '{"NIO_ALLOC_COUNTER_TESTS_PARALLEL": "true"}'

  integration-tests:
    name: Integration tests
    needs: integration-test-toolchains
    uses: rnro/github-workflows/.github/workflows/execute_matrix.yml@self-repo-reference
    with:
      name: integration-tests
      matrix_yaml_string: ${{ needs.integration-test-toolchains.outputs.matrix_yaml }}
      # The job runs unprivileged on the runner but as root in a container,
      # where sudo is not installed.
      setup_command: |
        if command -v sudo >/dev/null 2>&1; then
          sudo apt-get update -y -q && sudo apt-get install -y -q lsof dnsutils netcat-openbsd net-tools curl jq
        else
          apt-get update -y -q && apt-get install -y -q lsof dnsutils netcat-openbsd net-tools curl jq
        fi
      command: "./scripts/integration_tests.sh"

  vsock-tests:
    name: Vsock tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Load vsock_loopback kernel module
        run: sudo modprobe vsock_loopback
      - name: Build package tests
        run: swift build --build-tests
      - name: Run Vsock tests
        shell: bash  # explicitly choose bash, which ensures -o pipefail
        run: swift test --filter "(?i)vsock" | tee test.out
      - name: Check for skipped tests
        run: test -r test.out && ! grep -i skipped test.out
